name: build and deploy

on:
  push:
    branches: ['main']
  pull_request: {}

permissions:
  contents: read

jobs:
  ci:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v6
        with:
          run_install: true

      - name: Install playwright browsers
        run: pnpm playwright:install --with-deps && pnpm playwright:install:webkit --with-deps

      - name: Run all checks
        run: pnpm verify

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  publish:
    name: publish packages
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing and provenance both use the OIDC token of this job
      id-token: write
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@v6
        with:
          run_install: true

      - run: pnpm run publishNpmPkg
        name: Publish npm packages
        env:
          NPM_CONFIG_PROVENANCE: 'true'

  tag:
    name: tag releases
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # the only job that pushes; it installs no dependencies, so no package script runs while it holds this token
      contents: write
    concurrency:
      group: tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # all commits and tags: a release is tagged at the commit npm recorded for it, which may be an older one
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: node scripts/tagReleases.mjs
        name: Tag released versions
